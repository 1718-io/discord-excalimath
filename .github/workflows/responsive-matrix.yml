name: Responsive matrix

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  responsive-tests:
    name: Storybook + Playwright responsive checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: pnpm -C ../backend install --frozen-lockfile

      - name: Build the app
        run: pnpm build

      - name: Build and test backend
        run: pnpm -C ../backend build && pnpm -C ../backend test

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run responsive matrix tests
        run: pnpm test:responsive --reporter=line

      - name: Run standalone and room-sync route tests
        run: pnpm test:routes
